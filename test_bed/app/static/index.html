<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShopFlow — Official Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

<!-- Header -->
<header class="bg-white border-b px-6 py-4 flex items-center justify-between sticky top-0 z-30 shadow-sm">
  <div class="flex items-center gap-3">
    <span class="font-bold text-xl tracking-tight">ShopFlow</span>
    <span id="status" class="text-xs px-2.5 py-0.5 rounded-full bg-green-100 text-green-700 font-medium">● Online</span>
  </div>
  <div class="flex items-center gap-4">
    <button onclick="toggleDevPanel()" class="text-xs text-gray-400 hover:text-gray-600 transition">DevOps ⚙</button>
    <button onclick="openCart()" class="relative text-lg p-1">
      🛒<span id="badge" class="hidden absolute -top-1 -right-2 bg-blue-600 text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full font-bold">0</span>
    </button>
  </div>
</header>

<!-- DevOps Control Bar -->
<div id="dev-panel" class="hidden bg-slate-900 text-white px-6 py-3 border-b border-slate-800">
  <div class="flex items-center justify-between mb-2">
    <p class="text-[11px] text-slate-400 font-mono uppercase tracking-wider">Traffic & Failure Scenarios</p>
    <span class="text-[10px] text-slate-500 font-mono">Cluster: BLR-Node-1</span>
  </div>
  <div class="flex flex-wrap gap-2">
    <button onclick="inject('billing')"    class="inj-btn bg-red-950/80 text-red-300 border-red-800 hover:bg-red-900">ZeroDivision (FREE100)</button>
    <button onclick="inject('checkout')"   class="inj-btn bg-amber-950/80 text-amber-300 border-amber-800 hover:bg-amber-900">KeyError (Guest Checkout)</button>
    <button onclick="inject('inventory')"  class="inj-btn bg-yellow-950/80 text-yellow-300 border-yellow-800 hover:bg-yellow-900">IndexError (Tier 99)</button>
    <button onclick="inject('auth')"       class="inj-btn bg-purple-950/80 text-purple-300 border-purple-800 hover:bg-purple-900">TypeError (Session)</button>
    <button onclick="inject('promotions')" class="inj-btn bg-rose-950/80 text-rose-300 border-rose-800 hover:bg-rose-900">ValueError (Coupon)</button>
    <button onclick="inject('gateway')"    class="inj-btn bg-blue-950/80 text-blue-300 border-blue-800 hover:bg-blue-900">TimeoutError (Gateway)</button>
    <button onclick="storm()"              class="inj-btn bg-indigo-900 text-indigo-200 border-indigo-700 hover:bg-indigo-800 font-semibold">⚡ Traffic Burst (100x)</button>
  </div>
</div>
<style>.inj-btn{font-size:11px;font-family:monospace;padding:5px 10px;border-radius:6px;border-width:1px;transition:all 0.15s;cursor:pointer;}</style>

<!-- Main Storefront -->
<main class="max-w-5xl mx-auto px-6 py-10">
  <div class="mb-8">
    <h1 class="text-2xl font-bold tracking-tight text-gray-900">Featured Inventory</h1>
    <p class="text-gray-500 text-sm mt-1">Direct from Bangalore Fulfillment Centers with instant dispatch.</p>
  </div>
  <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
</main>

<!-- Cart Drawer -->
<div id="overlay" onclick="closeCart()" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-40"></div>
<aside id="drawer" class="fixed right-0 top-0 h-full w-80 bg-white border-l z-50 flex flex-col translate-x-full transition-transform duration-200 shadow-2xl">
  <div class="px-6 py-4 border-b flex justify-between items-center bg-gray-50">
    <h2 class="font-semibold text-gray-800">Shopping Cart</h2>
    <button onclick="closeCart()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
  </div>
  <div id="cart-list" class="flex-1 overflow-y-auto p-6 space-y-3 text-sm"></div>
  <div class="p-6 border-t bg-gray-50 space-y-3">
    <div class="flex justify-between text-sm font-semibold text-gray-800">
      <span>Estimated Total</span><span id="total">₹0</span>
    </div>
    <input id="coupon" type="text" placeholder="Promo Code (e.g. SAVE10)"
      class="w-full border rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    <input id="address" type="text" placeholder="Delivery Address (blank for guest)"
      class="w-full border rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    <button onclick="checkout()"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl text-sm font-semibold transition shadow-sm">
      Confirm & Place Order
    </button>
  </div>
</aside>

<!-- Status Modal -->
<div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeModal()"></div>
  <div id="modal-card" class="relative bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full mx-4 border"></div>
</div>

<!-- Network Event Stream (Storefront Client Log) -->
<div class="fixed bottom-4 right-4 w-80 bg-white border rounded-xl shadow-xl z-20 overflow-hidden">
  <div class="px-4 py-2 bg-gray-50 border-b flex justify-between items-center">
    <span class="text-[10px] uppercase tracking-wider text-gray-500 font-semibold font-mono">Network Events</span>
    <button onclick="clearLog()" class="text-[10px] text-gray-400 hover:text-gray-600 font-mono">clear</button>
  </div>
  <div id="log" class="overflow-y-auto p-3 space-y-1 font-mono text-[11px] bg-white" style="max-height:160px;"></div>
</div>

<script>
const API = 'http://localhost:8000/api';
let cart = [];

// Logger
const logEl = document.getElementById('log');
function slog(msg, c='text-gray-500') {
  const ts = new Date().toLocaleTimeString('en-GB',{hour12:false});
  const d = document.createElement('div');
  d.className = c; d.textContent = `${ts}  ${msg}`;
  logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
}
function clearLog() { logEl.innerHTML = ''; }

// Health Check
async function checkHealth() {
  const el = document.getElementById('status');
  try {
    const res = await fetch(`${API}/health`);
    if (res.ok) {
      el.textContent = '● Online';
      el.className = 'text-xs px-2.5 py-0.5 rounded-full bg-green-100 text-green-700 font-medium';
    } else { throw new Error(); }
  } catch {
    el.textContent = '● Offline';
    el.className = 'text-xs px-2.5 py-0.5 rounded-full bg-red-100 text-red-700 font-medium';
  }
}

// Load Catalog
async function loadProducts() {
  try {
    const {products} = await (await fetch(`${API}/products`)).json();
    document.getElementById('grid').innerHTML = products.map(p => `
      <div class="bg-white border rounded-2xl p-5 hover:shadow-lg transition flex flex-col justify-between">
        <div>
          <div class="text-4xl mb-3">${p.emoji}</div>
          <p class="text-[10px] text-gray-400 font-mono uppercase tracking-wider mb-1">${p.category}</p>
          <h3 class="font-semibold text-sm mb-3 leading-snug text-gray-800">${p.name}</h3>
        </div>
        <div>
          <div class="flex items-center justify-between mb-2">
            <span class="font-bold text-blue-600 text-base">₹${Number(p.price).toLocaleString('en-IN')}</span>
            <button onclick='add(${JSON.stringify(p)})' class="text-xs bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg transition font-medium">Add to Cart</button>
          </div>
          <p class="text-[10px] text-gray-400 font-mono">${p.stock} units available · SKU: ${p.sku}</p>
        </div>
      </div>`).join('');
  } catch { slog('ERR: Failed to connect to product catalog', 'text-red-500 font-semibold'); }
}

// Cart Management
function add(p) {
  const e = cart.find(i => i.p.id === p.id);
  e ? e.q++ : cart.push({p, q: 1});
  renderCart();
  slog(`CART: Added "${p.name.slice(0,25)}..."`, 'text-green-600');
}
function remove(i) { cart.splice(i, 1); renderCart(); }
function renderCart() {
  const tot = cart.reduce((s,i) => s + i.p.price * i.q, 0);
  const cnt = cart.reduce((s,i) => s + i.q, 0);
  document.getElementById('total').textContent = `₹${tot.toLocaleString('en-IN')}`;
  const b = document.getElementById('badge');
  cnt > 0 ? (b.textContent = cnt, b.classList.remove('hidden')) : b.classList.add('hidden');
  const el = document.getElementById('cart-list');
  el.innerHTML = cart.length ? cart.map((i,idx) => `
    <div class="flex items-center gap-3 bg-gray-50 p-2.5 rounded-xl border">
      <span class="text-2xl">${i.p.emoji}</span>
      <div class="flex-1 min-w-0">
        <p class="font-medium text-xs truncate text-gray-800">${i.p.name}</p>
        <p class="text-gray-400 text-xs font-mono">₹${Number(i.p.price).toLocaleString('en-IN')} × ${i.q}</p>
      </div>
      <button onclick="remove(${idx})" class="text-gray-300 hover:text-red-500 text-xl font-bold">&times;</button>
    </div>`).join('') : '<p class="text-gray-400 text-center mt-6">Your shopping cart is empty.</p>';
}
function openCart() { document.getElementById('drawer').classList.replace('translate-x-full','translate-x-0'); document.getElementById('overlay').classList.remove('hidden'); }
function closeCart() { document.getElementById('drawer').classList.replace('translate-x-0','translate-x-full'); document.getElementById('overlay').classList.add('hidden'); }

// Checkout Flow
async function checkout() {
  if (!cart.length) return;
  const addr = document.getElementById('address').value.trim();
  const code = document.getElementById('coupon').value.trim().toUpperCase() || null;
  slog(`HTTP POST /api/checkout${code ? ` [Coupon: ${code}]` : ''}`, 'text-blue-600 font-medium');
  closeCart();
  try {
    const res = await fetch(`${API}/checkout`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        coupon_code: code,
        customer_payload: addr ? {shipping_address: addr} : {},
        warehouse_tier: 0
      })
    });
    const data = await res.json();
    if (res.ok) {
      slog(`HTTP 200: Order ${data.order.order_id} confirmed (₹${data.billing.total_payable})`, 'text-green-600');
      showSuccess(data);
      cart = []; renderCart();
    } else {
      slog(`HTTP 500: Server error (${data.error_type})`, 'text-red-500 font-semibold');
      showError(data);
    }
  } catch(e) { slog(`NET_ERR: ${e.message}`, 'text-red-500'); }
}

// Modals
function showSuccess(d) {
  document.getElementById('modal-card').innerHTML = `
    <div class="text-center">
      <div class="text-4xl mb-3">✅</div>
      <h2 class="text-lg font-bold mb-1 text-gray-800">Order Confirmed</h2>
      <p class="text-gray-400 text-xs font-mono mb-5">${d.order.order_id}</p>
      <div class="bg-gray-50 rounded-xl p-4 text-left text-sm space-y-1.5 mb-5 border">
        <div class="flex justify-between"><span class="text-gray-500">Subtotal</span><span>₹${d.billing.subtotal}</span></div>
        <div class="flex justify-between"><span class="text-gray-500">Discount</span><span class="text-green-600">−₹${d.billing.discount_amount}</span></div>
        <div class="flex justify-between"><span class="text-gray-500">GST (18%)</span><span>₹${d.billing.tax}</span></div>
        <div class="flex justify-between font-bold border-t pt-2 text-gray-900"><span>Total Payable</span><span class="text-blue-600">₹${d.billing.total_payable}</span></div>
      </div>
      <p class="text-xs text-gray-400 font-mono">Fulfillment Hub: ${d.facility}</p>
      <button onclick="closeModal()" class="mt-4 text-sm text-gray-500 hover:text-gray-800 font-medium">Done</button>
    </div>`;
  document.getElementById('modal').classList.remove('hidden');
}

function showError(d) {
  document.getElementById('modal-card').innerHTML = `
    <div class="text-center">
      <div class="text-4xl mb-3">⚠️</div>
      <h2 class="text-lg font-bold text-red-600 mb-1">Server Error</h2>
      <p class="text-gray-700 font-medium text-sm mb-1">${d.error_type}</p>
      <p class="text-gray-400 text-xs font-mono mb-5">${d.message || 'Internal Server Error'}</p>
      <div class="bg-red-50 border border-red-100 rounded-xl p-3 text-xs text-red-700 text-left mb-5">
        An unhandled server exception occurred while processing this transaction. The failure details have been recorded in the server log.
      </div>
      <button onclick="closeModal()" class="text-sm text-gray-500 hover:text-gray-800 font-medium">Close</button>
    </div>`;
  document.getElementById('modal').classList.remove('hidden');
}

function closeModal() { document.getElementById('modal').classList.add('hidden'); }

// DevOps Panel
function toggleDevPanel() { document.getElementById('dev-panel').classList.toggle('hidden'); }

const SCENARIOS = {
  billing:    {url:'/checkout',         body:{coupon_code:'FREE100',customer_payload:{shipping_address:'5th Block, Bangalore'},warehouse_tier:0}},
  checkout:   {url:'/checkout',         body:{coupon_code:null,customer_payload:{},warehouse_tier:0}},
  inventory:  {url:'/checkout',         body:{coupon_code:null,customer_payload:{shipping_address:'5th Block, Bangalore'},warehouse_tier:99}},
  auth:       {url:'/auth/verify',      body:{session_token:'EXPIRED_JWT_XYZ'}},
  promotions: {url:'/promotions/apply', body:{coupon_code:'MALFORMED_MINUS50',base_amount:1000}},
  gateway:    {url:'/payment/charge',   body:{order_id:'ORD-DEMO',amount:1200,simulate_network_hang:true}},
};

async function inject(type) {
  const s = SCENARIOS[type];
  slog(`[TEST] Invoking ${type}...`, 'text-slate-600');
  try {
    const res = await fetch(`${API}${s.url}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(s.body)
    });
    const d = await res.json();
    if (res.ok) {
      slog(`HTTP 200: Handled successfully`, 'text-green-600 font-semibold');
    } else {
      slog(`HTTP 500: ${d.error_type} triggered`, 'text-red-500 font-semibold');
      showError(d);
    }
  } catch(e) { slog(`ERR: ${e.message}`, 'text-red-500'); }
}

async function storm() {
  slog('BURST: Dispatching 100 concurrent requests...', 'text-amber-600 font-semibold');
  const reqs = Array.from({length: 100}).map(() =>
    fetch(`${API}/checkout`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({coupon_code: 'FREE100', customer_payload: {shipping_address: 'BLR'}, warehouse_tier: 0})
    }).catch(() => null)
  );
  const results = await Promise.all(reqs);
  const errors = results.filter(r => r && r.status === 500).length;
  slog(`BURST DONE: ${errors}/100 responses returned 500 Server Error`, 'text-red-600 font-semibold');
}

checkHealth(); loadProducts(); renderCart();
setInterval(checkHealth, 30000);
</script>
</body>
</html>
